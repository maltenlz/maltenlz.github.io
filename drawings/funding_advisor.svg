  </pattern>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="9" cy="9" r="1" fill="#fbfbfb"/>
  </pattern>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <rect width="50" height="50" fill="url(#grid-small)"/>
    <path d="M50 0H0V50" fill="none" stroke="#fbfbfb" stroke-width="1"/>
  </pattern>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#333333" stroke-width="0.7" opacity="0.55"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 1L10 5L0 9" fill="none" stroke="#333333" stroke-width="1.4"/>
  </marker>
  <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M2 8L8 2" stroke="#333333" stroke-width="1.2"/>
  </marker>
</defs>
